name: Run Proxy Cleaner

on:
  schedule:
    - cron: '0 */6 * * *' # Dar 6 ghante run thase
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run script
        run: python proxy_cleaner.py

      - name: Commit and push updated playlist
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add smooth_playlist.m3u
          git commit -m "Auto-generate smooth playlist" || exit 0
          git push
